# =============================================================================
# CompliBot - Docker Compose Configuration
# =============================================================================
# Ports: App 3005, PostgreSQL 5437, Redis 6384
# Network: 172.38.0.0/24
# =============================================================================

services:
  complibot-postgres:
    image: pgvector/pgvector:0.8.2-pg16@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc # pgvector 0.8.2 (CVE-2026-3172, bumped 2026-06-06)
    container_name: complibot-postgres
    hostname: complibot-postgres
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_OVERRIDE
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required in .env}
      POSTGRES_DB: complibot
      # App-specific user password (least-privilege — must be set separately)
      COMPLIBOT_DB_PASSWORD: ${COMPLIBOT_DB_PASSWORD:?COMPLIBOT_DB_PASSWORD required in .env}
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - complibot-postgres-data:/var/lib/postgresql/data
      - ./postgres/init-user.sh:/docker-entrypoint-initdb.d/10-init-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      complibot-network:
        ipv4_address: 172.38.0.10
    restart: "no"
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
          pids: 200
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
        compress: "true"

  complibot-redis:
    image: redis:8.10.0-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
    container_name: complibot-redis
    hostname: complibot-redis
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    ports:
      - "127.0.0.1:6384:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required in .env}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required in .env}
    volumes:
      - complibot-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      complibot-network:
        ipv4_address: 172.38.0.11
    restart: "no"
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
          pids: 200
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
        compress: "true"

  complibot-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - DOCKER_BUILD=1
    container_name: complibot-app
    hostname: complibot-app
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=100m
      - /app/.next/cache:size=200m
      - /app/uploads:size=500m
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://complibot:${COMPLIBOT_DB_PASSWORD:?COMPLIBOT_DB_PASSWORD required in .env}@172.38.0.10:5432/complibot
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD required in .env}@172.38.0.11:6379
      - REDIS_HOST=172.38.0.11
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD required in .env}
      - AUTH_SECRET=${AUTH_SECRET:?AUTH_SECRET required}
      - NEXTAUTH_URL=http://localhost:3005
      - AUTH_TRUST_HOST=true
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - CLAUDE_BRIDGE_URL=${CLAUDE_BRIDGE_URL:-http://host.docker.internal:7777}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-opus}
      - CLAUDE_BRIDGE_TOKEN=${CLAUDE_BRIDGE_TOKEN:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY required in .env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3005:3000"
    depends_on:
      complibot-postgres:
        condition: service_healthy
      complibot-redis:
        condition: service_healthy
    networks:
      complibot-network:
        ipv4_address: 172.38.0.12
    restart: "no"
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "-O",
          "/dev/null",
          "http://127.0.0.1:3000/api/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2"
          pids: 200
        reservations:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

volumes:
  complibot-postgres-data:
  complibot-redis-data:

networks:
  complibot-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.38.0.0/24
