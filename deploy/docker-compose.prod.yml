# =============================================================================
# CompliBot — PRODUCTION overlay
# =============================================================================
# Use ON TOP of the base compose, from the app dir:
#
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml \
#     --env-file deploy/.env.prod up -d --build
#
# What it changes vs the dev base:
#   - restart: unless-stopped on all services (auto-recover on reboot/crash)
#   - adds Caddy (80/443, automatic TLS) in front of the app
#   - adds a self-hosted Ollama so answers never leave the box (matches the
#     "self-hosted / your data, your servers" positioning)
#   - points the app at the public HTTPS URL + the local Ollama
#
# ⚠️ Not yet validated on a live server — test on a staging box first.
#    After the first `up`, pull the models into the bundled Ollama, e.g.:
#       docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml #         exec complibot-ollama ollama pull qwen2.5:7b
# =============================================================================

services:
  complibot-postgres:
    restart: unless-stopped

  complibot-redis:
    restart: unless-stopped

  complibot-init:
    environment:
      OLLAMA_HOST: http://complibot-ollama:11434

  complibot-app:
    restart: unless-stopped
    environment:
      # Public origin — REQUIRED for NextAuth callbacks.
      - NEXTAUTH_URL=${COMPLIBOT_PUBLIC_URL:?set to https://your-domain in deploy/.env.prod}
      # Self-hosted LLM on this box (data residency).
      - LLM_PROVIDER=ollama
      - OLLAMA_HOST=http://complibot-ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
    depends_on:
      complibot-postgres:
        condition: service_healthy
      complibot-redis:
        condition: service_healthy
      complibot-ollama:
        condition: service_healthy

  complibot-ollama:
    image: ollama/ollama:0.32.14@sha256:9d30908e41144b1f1da89b9d8e33c07e4aeb43ff41a8660241b1686e2cc330ad # bumped 2026-06-13 (0.5.7 had CVE-2026-7482 "Bleeding Llama")
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - complibot-ollama-data:/root/.ollama
    healthcheck:
      # `ollama list` returns non-zero until the server is up.
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "4"
          pids: 200
        reservations:
          memory: 4G
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3", compress: "true" }

  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648 # pinned + digest (2026-06-13)
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "80:80"
      - "443:443"
    environment:
      - COMPLIBOT_DOMAIN=${COMPLIBOT_DOMAIN:?set to your domain in deploy/.env.prod}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - complibot-caddy-data:/data
      - complibot-caddy-config:/config
    # Certs live in /data and the autosave in /config (both named volumes, still
    # writable), so a read-only root only needs scratch /tmp.
    read_only: true
    tmpfs:
      - /tmp:size=20m
    depends_on:
      complibot-app:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
          pids: 100 # added 2026-07-18 (audit P3) — only service in the overlay without one
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3", compress: "true" }

volumes:
  complibot-ollama-data:
  complibot-caddy-data:
  complibot-caddy-config:
